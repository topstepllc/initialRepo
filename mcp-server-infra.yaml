AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cognito (OAuth authorization server) + API Gateway HTTP API (JWT-authorized)
  fronting the spp-mcp-server Lambda. Token issuance and validation are both
  handled by AWS-managed pieces (Cognito Hosted UI, API Gateway's native JWT
  authorizer) rather than hand-written auth code -- see ai/mcpServer/ for the
  Lambda itself and the DCR-shim rationale.

Parameters:
  ResourceSuffix:
    Type: String
    Default: ""
    Description: >
      Appended to every named resource in this stack (e.g. "-acme" ->
      "sppMcpServer-acme") -- lets a second customer deploy this same
      template as its own stack without colliding with an existing one
      (FunctionName, DynamoDB TableName, and EventBridge Rule Name all have
      to be unique per AWS account/region, and would otherwise fail to
      create). Left empty for TopStep's own stack, which keeps the original
      unsuffixed names exactly as they are today -- changing this on an
      EXISTING stack renames (replaces) its resources, so never set this on
      a redeploy of an already-running customer's stack, only at first
      creation.

  CognitoDomainPrefix:
    Type: String
    Description: >
      REQUIRED, no default on purpose -- must be globally unique across
      ALL AWS accounts using Cognito prefix domains, not just this one, so
      a shared default would only work for the first stack that claims it.
      Hosted UI will be served at
      https://<this>.auth.<region>.amazoncognito.com

  ClaudeRedirectUri:
    Type: String
    Default: https://claude.ai/api/mcp/auth_callback
    Description: >
      Claude.ai's own OAuth callback endpoint -- the same fixed value for
      every custom connector on every stack, not generated per connector and
      not related to this stack's own MCP URL. Confirmed against TopStep's
      already-working stack, which uses this exact value. Set once at first
      deploy; there's no placeholder/redeploy dance needed (a previous
      version of this comment claimed otherwise -- that was wrong, confirmed
      when BGB's setup hit it directly). Override only if Claude.ai's own
      callback endpoint ever changes.

  McpServerImageUri:
    Type: String
    Description: >
      REQUIRED -- the ECR image URI for the spp-mcp-server Lambda (build and
      push via ai/mcpServer/deploy.ps1 or the equivalent docker commands
      before first deploying this stack; the Lambda resource needs the image
      to already exist in ECR).

  LambdaExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::776528084998:role/TopStepLambdaExecutionRole
    Description: >
      Reuses the same execution role already used by aiQueryReports and
      aiProcessQuestions (CloudWatch Logs, S3, DynamoDB access) rather than
      creating a new one.

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: >
      Only needed because the reused aiQueryReports/index.js constructs an
      Anthropic client unconditionally at module load -- this Lambda's MCP
      tools never actually call it.

  SppInstanceName:
    Type: String
    Description: >
      REQUIRED, no default on purpose -- this is the S3 company folder
      (spp-data/{this}/...) the Lambda reads REPORT_VIEWS from, via
      aiQueryReports/index.js's own SPP_INSTANCE_NAME lookup (reused
      unmodified in this stack). A shared default would mean a new
      customer's stack silently reads TopStep's own SPP data if this is
      ever left unset, rather than failing loudly. Pass "top-step" for
      TopStep's own stack.

  TermsTableName:
    Type: String
    Default: aiTerms
    Description: >
      NOTE: this table isn't created by any CloudFormation template in
      this repo (grep the repo for "aiTerms" -- this Parameter's default
      is the only reference) -- confirm it actually exists and how it was
      provisioned before relying on it, and give a new customer their own
      table here rather than reusing "aiTerms" as-is: it's a flat
      {term: definition} store with no per-customer partitioning, so two
      customers sharing it would see and could overwrite each other's
      terminology definitions.

  CreateTermsTable:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "true" creates TermsTableName in this stack (key: term, String). The
      original account's aiTerms* tables were made by hand before this
      existed, so its stacks leave this "false"; a fresh account sets it
      "true" so every customer gets their own table without a manual step.

  DataBucket:
    Type: String
    Default: topstep-ai-offering
    Description: >
      S3 bucket holding spp-data/{SppInstanceName}/... and
      static/spp-connected.html. Must match the sibling
      spp-data-sync-infra.yaml stack's DataBucket. S3 names are global, so
      any account other than the original one needs its own (see
      account-bootstrap.yaml).

  SppBaseOAuthConfigKey:
    Type: String
    Description: >
      REQUIRED, no default on purpose -- the existing oauth_config row
      (client_id/secret/urls/scope) that per-user SPP connections clone,
      see ai/mcpServer/sppUserAuth.js. This has to point at a base app
      registration made within THAT customer's own SPP instance (a
      different SPP tenant needs its own OAuth app, registered by whoever
      administers that customer's SPP account) -- a shared default would
      mean a new customer's users end up cloning TopStep's own SPP OAuth
      app and silently connecting to TopStep's SPP tenant instead of
      theirs. Pass "spp-top step-prod" for TopStep's own stack.

  SSMParamPrefix:
    Type: String
    Default: /spp/top-step
    Description: >
      REQUIRED for the write path (propose_spp_write/execute_spp_write) --
      mirrors spp-data-sync-infra.yaml's SSMParamPrefix exactly, same
      convention: {prefix}/{instance}Key, {prefix}/{instance}XMLURL must
      already exist in SSM. Reads never needed this before -- they go
      through the person's own OAuth token directly. Every non-TopStep
      customer stack MUST override this.

  SppInstance:
    Type: String
    Default: production
    AllowedValues: ["sandbox", "production", "demo"]
    Description: >
      Which SPP XML endpoint/API key the write path uses -- must match one
      of sppDataSync.js's KNOWN_INSTANCES and have a corresponding SSM
      param pair under SSMParamPrefix. Independent of SppInstanceName
      (that's the S3 company folder; this is the SPP tenant/environment).

  SppSyncIntegrationKey:
    Type: String
    Default: ""
    Description: >
      integrationKey used for the fire-and-forget post-write resync
      invocation of sppDataSync (company-level, e.g. "spp-top step-prod")
      -- NOT the caller's own per-user key. Should match whatever
      SyncIntegrationKey the corresponding spp-data-sync-infra.yaml stack
      already uses for its scheduled sync. REQUIRED once any write tool is
      actually used; safe to leave blank until then.

  SppDataSyncFunctionName:
    Type: String
    Default: sppDataSync
    Description: >
      Exact deployed sppDataSync Lambda FunctionName to invoke for the
      post-write resync (e.g. "sppDataSync-bgb"). Passed explicitly rather
      than derived from ResourceSuffix -- the two stacks' suffixes for the
      same customer are not guaranteed to match (confirmed: the demo
      account's spp-mcp-server stack uses "-rbreaux-2fb4" while its sibling
      spp-data-sync-infra stack uses "-rbreaux-2f4b").

Conditions:
  ShouldCreateTermsTable: !Equals [!Ref CreateTermsTable, "true"]

Resources:
  TermsTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldCreateTermsTable
    Properties:
      TableName: !Ref TermsTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: term
          AttributeType: S
      KeySchema:
        - AttributeName: term
          KeyType: HASH

  # -------------------------------------------------------
  # Cognito: the actual OAuth authorization server. Tokens are
  # issued and validated here -- nothing in this stack re-implements
  # OAuth token logic.
  # -------------------------------------------------------
  SppMcpUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "spp-mcp-users${ResourceSuffix}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # no public sign-up -- accounts are admin-provisioned
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  SppMcpUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref SppMcpUserPool

  SppMcpUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: claude-mcp-connector
      UserPoolId: !Ref SppMcpUserPool
      GenerateSecret: false # public client -- PKCE covers this, matches OAuth flow claude.ai drives
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Ref ClaudeRedirectUri
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        # Lets an AWS-credentialed admin (IAM AdminInitiateAuth permission --
        # a much higher trust bar than anything public) mint a token for a
        # given username/password directly via CLI/SDK, for testing/
        # debugging without a browser. Doesn't weaken the public-facing PKCE
        # flow Claude.ai actually uses -- that's unaffected either way.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
  # Lets oauth-endpoints.js's /register self-register a new, trusted
  # connector's redirect_uri into SppMcpUserPoolClient's callback allow-list
  # (see that file's own comments) instead of that being a manual console
  # step per connector. Scoped to ONLY this stack's own User Pool -- every
  # customer's stack gets its own copy of this policy on the shared
  # execution role, each only able to touch its own pool.
  SppMcpCognitoDcrPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "spp-mcp-cognito-dcr${ResourceSuffix}"
      Roles:
        - !Select [1, !Split ["/", !Ref LambdaExecutionRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:UpdateUserPoolClient
            Resource: !GetAtt SppMcpUserPool.Arn

  # -------------------------------------------------------
  # Lambda: the MCP server + OAuth metadata/DCR shim (ai/mcpServer/).
  # -------------------------------------------------------
  SppMcpServerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "sppMcpServer${ResourceSuffix}"
      PackageType: Image
      Code:
        ImageUri: !Ref McpServerImageUri
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 60
      MemorySize:
        3008 # bumped from 1024 -- this is also this AWS account's
        # actual Lambda memory ceiling right now, confirmed
        # by testing: 10240 (Lambda's own general maximum) is
        # rejected here with "value failed to satisfy
        # constraint: Member must have value less than or
        # equal to 3008", an account-level quota, not
        # something this template controls.
        #
        # AWS Lambda allocates CPU proportional to memory,
        # and this Lambda's cold-start table materialization
        # (DuckDB CSV parsing) is CPU-bound, not I/O-bound --
        # confirmed by testing:
        # running materialization concurrently (either on one
        # connection, which just serializes internally, or on
        # separate connections to the same shared instance)
        # gave ZERO speedup and sometimes made it slower
        # (contention), so parallelizing isn't the fix; more
        # CPU per table is. Matters far more for a
        # larger-data customer than for TopStep itself: this
        # API Gateway integration has a HARD 30-second
        # timeout (AWS's own platform maximum for HTTP APIs,
        # not something raising this Lambda's own Timeout
        # above can work around) -- confirmed happening in
        # production for BGB, whose larger tables alone
        # (e.g. one table took 14.5s at 1024 MB) blew well
        # past that cap on the very first "initialize" call,
        # which is what a Claude.ai connector add actually
        # sees as "Couldn't connect to the server."
      # No Layers here -- AWS does not support Lambda Layers on
      # PackageType: Image functions at all. oauthUtils.mjs/sharedUtils.js
      # (normally attached via the "sharedUtils" layer) are instead COPY'd
      # into this image directly, same as aiQueryReports/index.js is. See
      # the Dockerfile.
      Environment:
        Variables:
          SPP_INSTANCE_NAME: !Ref SppInstanceName
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          TERMS_TABLE: !Ref TermsTableName
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${SppMcpUserPool}"
          COGNITO_AUTHORIZATION_ENDPOINT: !Sub "https://${SppMcpUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize"
          COGNITO_TOKEN_ENDPOINT: !Sub "https://${SppMcpUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
          COGNITO_CLIENT_ID: !Ref SppMcpUserPoolClient
          COGNITO_USER_POOL_ID: !Ref SppMcpUserPool
          MCP_SERVER_BASE_URL: !Sub "https://${SppMcpApi}.execute-api.${AWS::Region}.amazonaws.com"
          FILTER_CACHE_TABLE: !Ref SppFilterCacheTable
          SPP_BASE_OAUTH_CONFIG_KEY: !Ref SppBaseOAuthConfigKey
          DATA_BUCKET: !Ref DataBucket
          SPP_CONNECTED_URL: !Sub "https://${DataBucket}.s3.${AWS::Region}.amazonaws.com/static/spp-connected.html"
          # AI-initiated writes (propose_spp_write/execute_spp_write) --
          # see ai/mcpServer/sppWriteClient.js and the write-feature plan.
          SSM_PARAM_PREFIX: !Ref SSMParamPrefix
          SPP_INSTANCE: !Ref SppInstance
          SPP_SYNC_INTEGRATION_KEY: !Ref SppSyncIntegrationKey
          SPP_DATA_SYNC_FUNCTION_NAME: !Ref SppDataSyncFunctionName
          WRITE_AUDIT_TABLE: !Ref SppWriteAuditTable

  SppMcpApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SppMcpServerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SppMcpApi}/*/*"

  # -------------------------------------------------------
  # API Gateway: the resource server. JWT authorizer validates
  # Cognito-issued tokens natively -- no hand-written token
  # verification code.
  # -------------------------------------------------------
  SppMcpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "spp-mcp-server${ResourceSuffix}"
      ProtocolType: HTTP

  SppMcpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SppMcpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SppMcpServerFunction.Arn
      PayloadFormatVersion: "2.0"

  SppMcpApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref SppMcpApi
      AuthorizerType: JWT
      Name: cognito-jwt
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${SppMcpUserPool}"
        Audience:
          - !Ref SppMcpUserPoolClient

  # Protected -- the actual MCP endpoint.
  SppMcpRouteMcp:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SppMcpApi
      RouteKey: "ANY /mcp"
      AuthorizationType: JWT
      AuthorizerId: !Ref SppMcpApiAuthorizer
      Target: !Sub "integrations/${SppMcpApiIntegration}"

  # Unauthenticated on purpose -- OAuth discovery/registration has to be
  # reachable before a client has a token.
  SppMcpRouteProtectedResourceMeta:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SppMcpApi
      RouteKey: "GET /.well-known/oauth-protected-resource"
      Target: !Sub "integrations/${SppMcpApiIntegration}"

  SppMcpRouteAuthServerMeta:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SppMcpApi
      RouteKey: "GET /.well-known/oauth-authorization-server"
      Target: !Sub "integrations/${SppMcpApiIntegration}"

  SppMcpRouteRegister:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SppMcpApi
      RouteKey: "POST /register"
      Target: !Sub "integrations/${SppMcpApiIntegration}"

  SppMcpRouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SppMcpApi
      RouteKey: "GET /"
      Target: !Sub "integrations/${SppMcpApiIntegration}"

  SppMcpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SppMcpApi
      StageName: "$default"
      AutoDeploy: true

  # -------------------------------------------------------
  # Filter-set enforcement: cached per-user permitted-ID lists
  # (fetched from SPP's REST API, which applies each person's
  # own filter set server-side -- see ai/mcpServer/sppRestClient.js).
  # A live SPP call per question would be too slow; this is
  # refreshed periodically by SppFilterCacheRefreshRule instead.
  # -------------------------------------------------------
  SppFilterCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sppFilterCache${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # Serves as BOTH the short-lived propose_spp_write -> execute_spp_write
  # proposal store AND the permanent write-audit log -- one row per write
  # attempt, status moves proposed -> executed/rejected_by_us/
  # rejected_by_spp. TTL is only ever present while status = "proposed";
  # ai/mcpServer/sppWriteStore.js explicitly REMOVEs it the instant a row
  # reaches a terminal state, so DynamoDB's TTL sweep only ever deletes
  # genuinely-abandoned proposals, never real audit history. See
  # sppWriteStore.js for the full design reasoning.
  SppWriteAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sppWriteAudit${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: proposalId
          AttributeType: S
      KeySchema:
        - AttributeName: proposalId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SppFilterCacheRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "spp-filter-cache-refresh${ResourceSuffix}"
      ScheduleExpression: "rate(6 hours)"
      State: ENABLED
      Targets:
        - Id: SppMcpServerFunction
          Arn: !GetAtt SppMcpServerFunction.Arn
          Input: '{"action":"refreshFilterCache"}'

  SppFilterCacheRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SppMcpServerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SppFilterCacheRefreshRule.Arn

  # -------------------------------------------------------
  # Keep-warm ping: full materialization alone can already exceed API
  # Gateway's hard 30-second integration timeout on a larger customer's
  # data (confirmed happening in production for BGB -- a real user query
  # timed out this way, even though the query itself ran fast once the
  # container was warm). Pinging every 5 minutes -- well inside Lambda's
  # typical idle-container retention window -- keeps one container warm
  # continuously during normal usage, so real requests mostly land on an
  # already-materialized container instead of paying that cost themselves.
  # Applies to every customer's stack via this shared template, not just
  # BGB's -- no real downside for a smaller customer like TopStep, and it
  # only gets more relevant as any customer's data grows over time.
  # -------------------------------------------------------
  SppMcpKeepWarmRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "spp-mcp-keep-warm${ResourceSuffix}"
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Id: SppMcpServerFunction
          Arn: !GetAtt SppMcpServerFunction.Arn
          Input: '{"action":"keepWarm"}'

  SppMcpKeepWarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SppMcpServerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SppMcpKeepWarmRule.Arn

Outputs:
  McpServerBaseUrl:
    Value: !Sub "https://${SppMcpApi}.execute-api.${AWS::Region}.amazonaws.com"
  McpEndpointUrl:
    Value: !Sub "https://${SppMcpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"
  HostedUIDomain:
    Value: !Sub "https://${SppMcpUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolId:
    Value: !Ref SppMcpUserPool
  UserPoolClientId:
    Value: !Ref SppMcpUserPoolClient
  FilterCacheTableName:
    Value: !Ref SppFilterCacheTable
  WriteAuditTableName:
    Value: !Ref SppWriteAuditTable
